<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PC 설정, 네트워크 절차, 소프트웨어 단축키를 검색하는 개인 명령어 카탈로그">
  <title>명령어 보관함</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="#top"><span class="brand-mark">⌘</span> 명령어 보관함</a><a class="github" href="https://pages.github.com/">GitHub Pages 배포 안내 ↗</a></header>
  <main id="top">
    <section class="hero">
      <div class="eyebrow">PERSONAL KNOWLEDGE BASE</div>
      <h1>필요한 명령을<br><span>빠르게 찾아 쓰세요.</span></h1>
      <p>PC 설정부터 프로그램 단축키까지, 한곳에서 검색하고 순서대로 확인합니다.</p>
      <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="명령어, 기능, 설명 검색…" autocomplete="off"><kbd>Enter</kbd></div>
      <div class="stats"><div><strong id="item-count">—</strong><span>검색 항목</span></div><div><strong id="guide-count">—</strong><span>순서별 가이드</span></div><div><strong>3</strong><span>분야</span></div></div>
    </section>
    <section class="workspace">
      <aside class="sidebar">
        <div class="side-label">분야</div><nav id="categories" aria-label="분야 필터"></nav>
        <div class="side-label app-label">프로그램</div><select id="app-filter" aria-label="프로그램 필터"><option value="">모든 프로그램</option></select>
        <div class="tip"><b>사용 팁</b><p>PC 설정은 가이드에서 순서대로, 자주 쓰는 명령은 검색창에서 바로 찾을 수 있어요.</p></div>
      </aside>
      <section class="results" aria-live="polite">
        <div class="results-head"><div><div class="eyebrow" id="section-kicker">전체 보관함</div><h2 id="section-title">모든 항목</h2></div><span id="result-count" class="result-count"></span></div>
        <div id="guide-area"></div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty" hidden><div>⌕</div><h3>검색 결과가 없습니다</h3><p>다른 검색어나 필터를 선택해 보세요.</p></div>
      </section>
    </section>
  </main>
  <footer>개인용 참고 자료 · 실행 전 명령과 대상 PC를 확인하세요.</footer>
  <script src="app.js"></script>
</body>
</html>
